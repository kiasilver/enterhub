services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterhub-web
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      DATABASE_URL: postgresql://enterhub:enterhub_secret@postgres:5432/enterhub?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-use-openssl-rand}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      NODE_ENV: production
      PORT: "3000"
      SOCKET_CORS_ORIGIN: ${SOCKET_CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - enterhub-net
    # Exposed only via nginx in production; map for local debug if needed:
    # ports:
    #   - "3000:3000"

  postgres:
    image: postgres:16-alpine
    container_name: enterhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: enterhub
      POSTGRES_PASSWORD: enterhub_secret
      POSTGRES_DB: enterhub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterhub -d enterhub"]
      interval: 60s
      timeout: 5s
      retries: 10
    networks:
      - enterhub-net

  redis:
    image: redis:7-alpine
    container_name: enterhub-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - enterhub-net

  nginx:
    image: nginx:1.27-alpine
    container_name: enterhub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - enterhub-net

volumes:
  postgres_data:
  redis_data:

networks:
  enterhub-net:
    driver: bridge
